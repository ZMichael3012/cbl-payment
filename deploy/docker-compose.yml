name: cbl-payment
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cbl
      POSTGRES_PASSWORD: cbl
      POSTGRES_DB: payment
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbl -d payment"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cbl-net]
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports: ["9092:9092"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward_transitive
    ports: ["8081:8081"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
  payment:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8030"
      GRPC_ADDR: ":9030"
      METRICS_ADDR: ":9230"
      PG_DSN: postgres://cbl:cbl@postgres:5432/payment?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      # Fast janitor for the e2e scenarios in test/e2e/E2E.md (local stand).
      PAYMENT_JANITOR_INTERVAL: 2s
      # Creation flow (4.2): this stand carries no quote/connector services, so
      # the clients stay disabled and CreatePayment answers Unavailable
      # fail-closed; the umbrella compose wires the real addresses.
    ports:
      - "8030:8030"
      - "9030:9030"
      - "9230:9230"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [cbl-net]

volumes:
  pg-data:
  kafka-data:

networks:
  cbl-net:
    driver: bridge
